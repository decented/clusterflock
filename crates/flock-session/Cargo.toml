[package]
name = "flock-session"
description = "Cluster Flock's match protocol: LocalRun, host authority, ClientSession, lobby, transports (loopback + QUIC over fray-net)."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "flock_session"
path = "src/lib.rs"

[dependencies]
flock-core = { path = "../flock-core" }
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
log = "0.4"
rand = { version = "0.8", default-features = false, features = ["std"] }
rand_pcg = "0.3"
# QUIC rooms, the LAN beacon and Bluetooth virtual links; the persona check.
decented-net = { package = "fray-net", git = "https://github.com/forgesworn/fray", rev = "4943413bb86a329c3ad9cc3180c02fd9186ef2ce", optional = true }
decented-signet = { git = "https://github.com/forgesworn/signet-play", rev = "7594a05450e3224aa8fc464a6fd69f36a642d52f", optional = true }
nostr = { version = "=0.44.8", default-features = false, features = ["nip44"], optional = true }
serde_json = { version = "1", optional = true }

[features]
default = ["native"]
native = ["dep:decented-net", "dep:decented-signet", "dep:nostr", "dep:serde_json"]

[[bin]]
name = "flock-headless"
path = "src/bin/flock-headless.rs"
required-features = ["native"]
