[package]
name = "gameflock"
description = "Cluster Flock: a portrait flock game for Android + desktop Linux."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "gameflock"
# rlib for the desktop binary and tests, cdylib for the Android NativeActivity .so.
crate-type = ["rlib", "cdylib"]
path = "src/lib.rs"

[[bin]]
name = "gameflock"
path = "src/main.rs"

# Versions and features are identical to Twang Thang's on purpose:
# workspaces that share a CARGO_TARGET_DIR with equal feature sets reuse the
# compiled wgpu/winit/egui artifacts.
[dependencies]
# My Signet sign-in, online-play permission, the played-with book and invites (signet-play).
# Every fray crate below must use the same git URL and rev that signet-play pins (4943413),
# or cargo builds two copies and the types don't match.
decented-signet = { git = "https://github.com/forgesworn/signet-play", rev = "7594a05450e3224aa8fc464a6fd69f36a642d52f" }
flock-core = { path = "../crates/flock-core" }
flock-session = { path = "../crates/flock-session" }
flock-render = { path = "../crates/flock-render" }
flock-audio = { path = "../crates/flock-audio" }
# The daily run's seed: a verified Bitcoin block header, fetched on a background thread.
blockseed = { git = "https://github.com/forgesworn/blockseed", rev = "e0432bbbb329f8cbc964bc13aae7b0721d049b54", features = ["fetch"] }
# The release half: the pinned-key release event, the Updater and the More games Catalog,
# the Android installer, and the Java it calls (tools/build-apk.sh compiles that in).
nostr-release-kit = { git = "https://github.com/forgesworn/nostr-release-kit", rev = "1c16b3e49433e635263b73e0efd600e8fbe647b3" }
# Identity (the device key) and the default relay list, for the My Signet account.
decented-net = { package = "fray-net", git = "https://github.com/forgesworn/fray", rev = "4943413bb86a329c3ad9cc3180c02fd9186ef2ce" }
# The shared relay pool (health, address normalising) and the one-shot relay
# reader in src/nostr_fetch.rs (the update check and More games). Versions and
# features equal decented-net's, so the shared target dir reuses its artifacts.
decented-relays = { package = "fray-relays", git = "https://github.com/forgesworn/fray", rev = "4943413bb86a329c3ad9cc3180c02fd9186ef2ce" }
nostr = { version = "=0.44.8", features = ["nip44"] }
glam = "0.29"
# Native backends only (Vulkan everywhere it exists, GLES as the fallback).
wgpu = { version = "29", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "gles"] }
winit = "0.30"
egui = "0.34"
egui-wgpu = { version = "0.34", default-features = false, features = ["winit"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
log = "0.4"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# mpsc channels of the Bluetooth links (fray's VirtualLink is a tokio mpsc pair);
# the rest is nostr_fetch.rs's own small runtime and timeouts.
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.26.2", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
# Screenshots stage an offer with the kit's `testing` methods (`demo_offer` swaps the pinned release
# key for a throwaway one): desktop only, never in the Android build.
nostr-release-kit = { git = "https://github.com/forgesworn/nostr-release-kit", rev = "1c16b3e49433e635263b73e0efd600e8fbe647b3", features = ["testing"] }
# No clipboard backend: text goes through platform::os (xclip / wl-copy).
egui-winit = { version = "0.34", default-features = false, features = ["x11", "wayland"] }
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }

[target.'cfg(target_os = "android")'.dependencies]
# The kit's Android installer (JNI into dev.forgesworn.release.Updater).
nostr-release-kit = { git = "https://github.com/forgesworn/nostr-release-kit", rev = "1c16b3e49433e635263b73e0efd600e8fbe647b3", features = ["android"] }
egui-winit = { version = "0.34", default-features = false, features = ["android-native-activity"] }
winit = { version = "0.30", features = ["android-native-activity"] }
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.14"
# JNI into the framework (intents, clipboard, Wi-Fi multicast lock, vibrator,
# immersive mode).
jni = "0.21"
ndk-context = "0.1"

[dev-dependencies]
base64 = "0.22"
